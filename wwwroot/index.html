<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>音乐下载器</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e8eaf0; --dim:#9aa3b2; --accent:#4f8cff; --accent2:#3ad29f;
    --danger:#ff5c5c; --radius:12px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.6 "Microsoft YaHei","PingFang SC",-apple-system,Segoe UI,sans-serif;
  }
  header{
    display:flex; align-items:center; gap:12px; padding:16px 22px;
    border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:10;
  }
  header h1{font-size:17px; margin:0; font-weight:600; letter-spacing:.5px}
  header .spacer{flex:1}
  .badge{
    font-size:12px; padding:3px 9px; border-radius:999px;
    background:var(--panel2); color:var(--dim); border:1px solid var(--line);
  }
  .badge.ok{color:var(--accent2); border-color:rgba(58,210,159,.4)}
  .badge.warn{color:#ffc857; border-color:rgba(255,200,87,.4)}
  .badge.bad{color:var(--danger); border-color:rgba(255,92,92,.4)}
  main{max-width:1000px; margin:0 auto; padding:22px}
  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px; margin-bottom:18px;
  }
  .searchbar{display:flex; gap:10px}
  input[type=text],input[type=password],select{
    flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:11px 14px; border-radius:10px; outline:none; font-size:14px;
  }
  input:focus,select:focus{border-color:var(--accent)}
  button{
    background:var(--accent); color:#fff; border:none; padding:11px 20px;
    border-radius:10px; cursor:pointer; font-size:14px; font-weight:500;
    transition:filter .15s, opacity .15s;
  }
  button:hover{filter:brightness(1.12)}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.ghost{background:var(--panel2); color:var(--text); border:1px solid var(--line)}
  button.small{padding:6px 13px; font-size:13px; border-radius:8px}
  .hint{color:var(--dim); font-size:12.5px; margin-top:9px}
  .list{margin-top:14px; max-height:430px; overflow:auto}
  .row{
    display:flex; align-items:center; gap:12px; padding:10px 12px;
    border-radius:10px; border:1px solid transparent; cursor:pointer;
  }
  .row:hover{background:var(--panel2); border-color:var(--line)}
  .row input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer}
  .row .num{color:var(--dim); min-width:26px; font-variant-numeric:tabular-nums}
  .row .meta{flex:1; min-width:0}
  .row .t{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .s{color:var(--dim); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .dur{color:var(--dim); font-size:12.5px; font-variant-numeric:tabular-nums}
  .albumlink{color:var(--accent); text-decoration:none; cursor:pointer}
  .albumlink:hover{text-decoration:underline}
  .toolbar{display:flex; align-items:center; gap:10px; margin-top:14px}
  .toolbar .spacer{flex:1}
  .task{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:10px; background:var(--panel2)}
  .task .head{display:flex; align-items:center; gap:10px; font-size:13px}
  .task .head .spacer{flex:1}
  .bar{height:6px; background:#0c0e12; border-radius:99px; margin-top:9px; overflow:hidden}
  .bar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .25s}
  .item{display:flex; gap:9px; font-size:12.5px; color:var(--dim); padding:3px 0}
  .item .st{min-width:88px}
  .item .err{color:var(--danger)}
  .modal{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal.show{display:flex}
  .modal .box{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px; width:100%; max-width:560px}
  .modal h2{margin:0 0 16px; font-size:16px}
  .field{margin-bottom:14px}
  .field label{display:block; margin-bottom:6px; font-size:13px; color:var(--dim)}
  .field .flexrow{display:flex; gap:8px}
  .switch{display:flex; align-items:center; gap:9px; font-size:13.5px}
  .switch input{width:16px; height:16px; accent-color:var(--accent)}
  .modal .actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px}
  .loading{color:var(--dim); padding:14px 0}
  .empty{color:var(--dim); text-align:center; padding:26px 0}
  code{background:#0c0e12; padding:2px 6px; border-radius:6px; font-size:12.5px}
  .about-row{
    display:flex; justify-content:space-between; gap:12px;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .about-row span:first-child{color:var(--dim)}
  .about-logo{text-align:center; padding:6px 0 16px}
  .about-logo .ico{font-size:38px; line-height:1}
  .about-logo .nm{font-size:17px; font-weight:600; margin-top:8px}
  .about-note{color:var(--dim); font-size:12.5px; margin-top:14px; line-height:1.75}
  .about-warn{color:var(--danger); font-size:12.5px; margin-top:12px; line-height:1.75}
  .about-link{color:var(--accent); text-decoration:none}
  .about-link:hover{text-decoration:underline}
</style>
</head>
<body>

<header>
  <h1>🎵 音乐下载器</h1>
  <span class="badge" id="cookieBadge">未配置 Cookie</span>
  <div class="spacer"></div>
  <button class="ghost small" id="btnOpen">打开下载目录</button>
  <button class="ghost small" id="btnAbout">关于</button>
  <button class="ghost small" id="btnSettings">设置</button>
</header>

<main>
  <div class="card">
    <div class="searchbar">
      <input type="text" id="q" placeholder="输入歌曲名 / 歌手 / 专辑，回车搜索" autofocus />
      <button id="btnSearch">搜索</button>
    </div>
    <div class="hint">支持网易云音乐；点击歌曲行的专辑名可展开整张专辑批量下载。</div>

    <div class="list" id="list"></div>

    <div class="toolbar" id="toolbar" style="display:none">
      <label class="switch"><input type="checkbox" id="checkAll" /> 全选</label>
      <span class="badge" id="selCount">已选 0 首</span>
      <div class="spacer"></div>
      <button id="btnDownload">下载选中</button>
    </div>
  </div>

  <div class="card" id="taskCard" style="display:none">
    <div style="display:flex;align-items:center;gap:10px">
      <strong style="font-size:14px">下载任务</strong>
      <div class="spacer" style="flex:1"></div>
      <button class="ghost small" id="btnClear">清除已完成</button>
    </div>
    <div id="tasks"></div>
  </div>
</main>

<div class="modal" id="modal">
  <div class="box">
    <h2>设置</h2>

    <div class="field">
      <label>网易云 Cookie（下载无损需要 VIP 登录态）</label>
      <textarea id="cookie" rows="4" style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px;border-radius:10px;font-size:12.5px;resize:vertical" placeholder="MUSIC_U=xxxx; __csrf=xxxx; ..."></textarea>
      <div class="flexrow" style="margin-top:9px;align-items:center">
        <button class="ghost small" id="btnCheckCookie" style="white-space:nowrap">检测账号</button>
        <span class="hint" id="cookieResult" style="margin:0;flex:1"></span>
      </div>
      <div class="hint">
        获取方式：浏览器登录 <a class="albumlink" href="https://music.163.com" target="_blank">music.163.com</a> → F12 → Network → 任意请求 → Request Headers 里的 Cookie 整段复制。
      </div>
    </div>

    <div class="field">
      <label>下载目录</label>
      <div class="flexrow">
        <input type="text" id="outputDir" />
        <button class="ghost" id="btnBrowse" style="white-space:nowrap">浏览…</button>
      </div>
    </div>

    <div class="field">
      <label>音质偏好</label>
      <select id="quality">
        <option value="lossless-fallback">无损优先，无无损时降级 MP3（推荐）</option>
        <option value="lossless">仅无损（无无损则报错）</option>
        <option value="mp3-320">MP3 320kbps</option>
        <option value="mp3-192">MP3 192kbps</option>
      </select>
    </div>

    <div class="field">
      <label>文件命名</label>
      <select id="naming">
        <option value="track-title">01. 歌名（按专辑曲序）</option>
        <option value="artist-title">歌手 - 歌名</option>
      </select>
    </div>

    <div class="field">
      <label class="switch"><input type="checkbox" id="embedCover" /> 将封面写入音频文件标签</label>
    </div>

    <div class="actions">
      <button class="ghost" id="btnCancel">取消</button>
      <button id="btnSave">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="aboutModal">
  <div class="box">
    <div class="about-logo">
      <div class="ico">🎵</div>
      <div class="nm">音乐下载器</div>
      <div class="hint" id="aboutVersion">读取中…</div>
    </div>

    <div class="about-row"><span>运行环境</span><span id="aboutRuntime">—</span></div>
    <div class="about-row"><span>账号状态</span><span id="aboutAccount">—</span></div>
    <div class="about-row"><span>下载目录</span><span id="aboutDir" style="max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span></div>

    <p class="about-note">
      用于个人收藏的网易云音乐下载工具：支持搜索歌曲与专辑、批量下载、
      无损或 MP3 音质，并自动写入歌词、封面与完整标签。
    </p>
    <p class="about-warn">
      ⚠️ 本工具仅供个人学习与备份已授权内容使用。请遵守网易云音乐用户协议与相关著作权法律，
      勿用于传播或商业用途。
    </p>

    <div class="actions">
      <button class="ghost" id="btnAboutRepo">项目主页</button>
      <button id="btnAboutClose">知道了</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let selected = new Set();
let currentSongs = [];
let tasks = [];
let pollTimer = null;

// ---------- 通用请求 ----------
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = 'HTTP ' + r.status;
    try { const j = await r.json(); if (j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  return r.json();
}

// ---------- 设置 ----------
async function loadSettings() {
  const s = await api('/api/settings');
  $('cookie').value = s.cookie || '';
  $('outputDir').value = s.outputDir || '';
  $('naming').value = s.naming || 'track-title';
  $('quality').value = s.quality || 'lossless-fallback';
  $('embedCover').checked = !!s.embedCover;
  if (s.hasCookie) {
    // 已保存 Cookie：后台做一次真实校验，而不是直接假定可用
    setBadge('检测中…', '');
    checkCookie(true);
  } else {
    setBadge('未配置 Cookie', '');
  }
}

function setBadge(text, cls) {
  const b = $('cookieBadge');
  b.textContent = text;
  b.className = 'badge' + (cls ? ' ' + cls : '');
}

/**
 * 真实检测 Cookie 是否有效、是否具备 VIP 权限。
 * @param {boolean} useSaved true=检测已保存的；false=检测输入框内容并给出详细提示
 */
async function checkCookie(useSaved) {
  const btn = $('btnCheckCookie');
  const out = $('cookieResult');
  if (!useSaved) {
    btn.disabled = true;
    btn.textContent = '检测中…';
    out.textContent = '';
    out.style.color = '';
  }
  try {
    const body = useSaved ? {} : { cookie: $('cookie').value.trim() };
    const r = await api('/api/check-cookie', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (r.valid && r.isVip) setBadge((r.nickname || '已登录') + ' · VIP', 'ok');
    else if (r.valid) setBadge(r.nickname || '已登录', 'warn');
    else if (r.reason === 'empty') setBadge('未配置 Cookie', '');
    else setBadge('Cookie 无效', 'bad');

    if (!useSaved) {
      out.textContent = r.message || '';
      out.style.color = (r.valid && r.isVip) ? 'var(--accent2)' : (r.valid ? '#ffc857' : 'var(--danger)');
    }
    return r;
  } catch (e) {
    setBadge('检测失败', 'bad');
    if (!useSaved) { out.textContent = '检测失败：' + e.message; out.style.color = 'var(--danger)'; }
  } finally {
    if (!useSaved) { btn.disabled = false; btn.textContent = '检测账号'; }
  }
}

$('btnCheckCookie').onclick = () => checkCookie(false);

// 打开系统「选择文件夹」对话框
$('btnBrowse').onclick = async () => {
  const btn = $('btnBrowse');
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = '请在弹出的窗口中选择…';
  try {
    const r = await api('/api/browse');
    if (r && r.path) $('outputDir').value = r.path;
  } catch (e) {
    alert('打开文件夹选择器失败：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
};

$('btnSettings').onclick = () => $('modal').classList.add('show');
$('btnCancel').onclick = () => $('modal').classList.remove('show');
$('btnSave').onclick = async () => {
  await api('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      cookie: $('cookie').value.trim(),
      outputDir: $('outputDir').value.trim(),
      naming: $('naming').value,
      quality: $('quality').value,
      embedCover: $('embedCover').checked,
    }),
  });
  // 保存后立即真实校验：有效则自动关闭，无效则留在面板里显示原因
  const r = await checkCookie(false);
  if (r && r.valid) setTimeout(() => $('modal').classList.remove('show'), 1000);
};

$('btnOpen').onclick = async () => {
  try { await api('/api/open'); } catch (e) { alert('打开失败：' + e.message); }
};

// ---------- 搜索 ----------
function fmtDur(ms) {
  if (!ms) return '';
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function doSearch() {
  const q = $('q').value.trim();
  if (!q) return;
  $('list').innerHTML = '<div class="loading">搜索中…</div>';
  $('toolbar').style.display = 'none';
  try {
    const data = await api('/api/search?q=' + encodeURIComponent(q));
    currentSongs = data.songs || [];
    renderSongs(currentSongs, false);
  } catch (e) {
    $('list').innerHTML = '<div class="empty">搜索失败：' + esc(e.message) + '</div>';
  }
}

function renderSongs(songs, isAlbum) {
  selected.clear();
  updateSelCount();
  if (!songs.length) {
    $('list').innerHTML = '<div class="empty">没有结果</div>';
    $('toolbar').style.display = 'none';
    return;
  }
  const html = songs.map((s, i) => `
    <div class="row" data-idx="${i}">
      <input type="checkbox" data-id="${s.id}" />
      <span class="num">${isAlbum ? String(i + 1).padStart(2, '0') : ''}</span>
      <div class="meta">
        <div class="t">${esc(s.name)}</div>
        <div class="s">${esc(s.artists)} · <span class="albumlink" data-album="${s.albumId}">${esc(s.album)}</span></div>
      </div>
      <span class="dur">${fmtDur(s.duration)}</span>
    </div>`).join('');
  $('list').innerHTML = html;
  $('toolbar').style.display = '';

  $('list').querySelectorAll('.row').forEach((row) => {
    const cb = row.querySelector('input[type=checkbox]');
    cb.onclick = (ev) => { ev.stopPropagation(); toggle(cb); };
    row.onclick = () => { cb.checked = !cb.checked; toggle(cb); };
  });
  $('list').querySelectorAll('.albumlink').forEach((a) => {
    a.onclick = async (ev) => {
      ev.stopPropagation();
      const id = a.dataset.album;
      if (!id || id === '0') return;
      await loadAlbum(id);
    };
  });
}

function toggle(cb) {
  const id = Number(cb.dataset.id);
  if (cb.checked) selected.add(id); else selected.delete(id);
  updateSelCount();
}

function updateSelCount() {
  $('selCount').textContent = '已选 ' + selected.size + ' 首';
  $('btnDownload').disabled = selected.size === 0;
  const all = $('list').querySelectorAll('input[type=checkbox]');
  $('checkAll').checked = all.length > 0 && selected.size === all.length;
}

async function loadAlbum(albumId) {
  $('list').innerHTML = '<div class="loading">加载专辑曲目…</div>';
  $('toolbar').style.display = 'none';
  try {
    const data = await api('/api/album?id=' + albumId);
    if (!data.songs || !data.songs.length) {
      $('list').innerHTML = '<div class="empty">该专辑暂无曲目（可能需要配置 Cookie）</div>';
      return;
    }
    currentSongs = data.songs;
    renderSongs(currentSongs, true);
    $('list').insertAdjacentHTML('afterbegin',
      `<div class="hint" style="padding:4px 12px">专辑：<strong>${esc(data.album)}</strong>（${data.songs.length} 首）</div>`);
  } catch (e) {
    $('list').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

$('btnSearch').onclick = doSearch;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

$('checkAll').onchange = () => {
  const on = $('checkAll').checked;
  $('list').querySelectorAll('input[type=checkbox]').forEach((cb) => {
    cb.checked = on;
    const id = Number(cb.dataset.id);
    if (on) selected.add(id); else selected.delete(id);
  });
  updateSelCount();
};

// ---------- 下载 ----------
$('btnDownload').onclick = async () => {
  if (selected.size === 0) return;
  $('btnDownload').disabled = true;
  try {
    const res = await api('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ songIds: Array.from(selected) }),
    });
    tasks.push(res.taskId);
    $('taskCard').style.display = '';
    startPolling();
  } catch (e) {
    alert('下载失败：' + e.message);
  } finally {
    $('btnDownload').disabled = false;
  }
};

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(pollTasks, 700);
  pollTasks();
}

async function pollTasks() {
  if (!tasks.length) { clearInterval(pollTimer); pollTimer = null; return; }
  const results = [];
  for (const id of tasks) {
    try { results.push(await api('/api/task?id=' + id)); } catch {}
  }
  renderTasks(results);
  const allDone = results.length > 0 && results.every((t) => t.status === '已完成');
  if (allDone) { clearInterval(pollTimer); pollTimer = null; }
}

function renderTasks(list) {
  $('tasks').innerHTML = list.map((t) => {
    const pct = t.total ? Math.round((t.completed + t.failed) * 100 / t.total) : 0;
    const items = t.items.map((it) => `
      <div class="item">
        <span class="st">${esc(it.status)}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.title || ('#' + it.songId))}</span>
        ${it.quality ? `<span class="badge" style="font-size:11px">${esc(it.quality)}</span>` : ''}
        ${it.error ? `<span class="err" title="${esc(it.error)}">${esc(it.error.slice(0, 40))}</span>` : ''}
      </div>`).join('');
    return `
      <div class="task">
        <div class="head">
          <strong>${t.completed}/${t.total}</strong>
          ${t.failed ? `<span style="color:var(--danger)">失败 ${t.failed}</span>` : ''}
          <div class="spacer"></div>
          <span class="badge">${esc(t.status)}</span>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div style="margin-top:8px">${items}</div>
      </div>`;
  }).join('');
}

$('btnClear').onclick = () => {
  tasks = [];
  $('tasks').innerHTML = '';
  $('taskCard').style.display = 'none';
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
};

// ---------- 关于 ----------
$('btnAbout').onclick = async () => {
  $('aboutVersion').textContent = '读取中…';
  try {
    const a = await api('/api/about');
    $('aboutVersion').textContent = '版本 ' + a.version;
    $('aboutRuntime').textContent = a.runtime || '—';
    $('aboutAccount').textContent = a.hasBuiltInAccount
      ? '已内置账号（开箱即用）'
      : '使用自己填写的 Cookie';
    const dir = $('outputDir').value || '—';
    $('aboutDir').textContent = dir;
    $('aboutDir').title = dir;
  } catch (e) {
    $('aboutVersion').textContent = '版本信息读取失败';
  }
  $('aboutModal').classList.add('show');
};
$('btnAboutClose').onclick = () => $('aboutModal').classList.remove('show');
